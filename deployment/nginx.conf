server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every page is prerendered into its own directory. Missing routes and assets
    # must return 404 instead of serving the homepage with a successful status.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
