<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attraccess – Machine access control for industry, R&amp;D and universities</title>
    <meta name="description" content="Qualification checks at the badge reader, machine enablement through your PLC and a record of every session. On-premises, with single sign-on." />
    <meta name="theme-color" content="#256d7b" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--head-meta-->
    <script>
      // Runs before first paint. Storage keys `theme` and `language` are documented in the privacy policy.
      (() => {
        const root = document.documentElement;
        let stored = {};
        try {
          stored = { theme: localStorage.getItem('theme'), language: localStorage.getItem('language') };
        } catch {
          // Storage unavailable: fall back to system settings.
        }

        // Theme: explicit choice, otherwise the operating system's preference.
        const theme =
          stored.theme === 'light' || stored.theme === 'dark'
            ? stored.theme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        root.classList.add(theme);
        root.dataset.theme = theme;

        // Language: ?lang= from the language switch wins, then an earlier choice, then the browser's
        // preferred languages. Crawlers are never redirected so both language versions stay indexable.
        const url = new URL(window.location.href);
        const fromLink = url.searchParams.get('lang');
        if (fromLink === 'en' || fromLink === 'de') {
          try {
            localStorage.setItem('language', fromLink);
          } catch {
            // Private mode: this navigation still lands on the chosen language.
          }
          url.searchParams.delete('lang');
          window.history.replaceState(null, '', url.pathname + url.search + url.hash);
          return;
        }
        if (/bot|crawl|spider|slurp|preview|lighthouse/i.test(navigator.userAgent) || navigator.webdriver) return;

        let language = stored.language === 'en' || stored.language === 'de' ? stored.language : null;
        if (!language) {
          const preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          const match = preferred.map((tag) => String(tag).toLowerCase().slice(0, 2)).find((tag) => tag === 'de' || tag === 'en');
          language = match || 'en';
        }
        const pairs = /*language-pairs*/ { '/': '/de/', '/contact': '/de/contact', '/credits': '/de/credits' };
        let path = url.pathname.replace(/index\.html$/, '');
        if (path === '/de') path = '/de/';
        else if (path.length > 1 && path.endsWith('/') && path !== '/de/') path = path.slice(0, -1);
        const target = language === 'de' ? pairs[path] : Object.keys(pairs).find((en) => pairs[en] === path);
        if (target && target !== path) window.location.replace(target + url.search + url.hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
